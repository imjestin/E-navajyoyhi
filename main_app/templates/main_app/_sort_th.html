{% comment %}
Sortable column header. Expects `key`, `label`, and the view's `sort`/`dir`
plus `querystring` in context. Clicking a sorted column flips the direction.
{% endcomment %}
<th class="nowrap">
    <a href="?{% for k, v in request.GET.items %}{% if k != 'sort' and k != 'dir' and k != 'page' %}{{ k }}={{ v }}&amp;{% endif %}{% endfor %}sort={{ key }}&amp;dir={% if sort == key and dir == 'asc' %}desc{% else %}asc{% endif %}"
       style="color: inherit; text-decoration: none;">
        {{ label }}
        {% if sort == key %}
            <i class="fas fa-caret-{% if dir == 'asc' %}up{% else %}down{% endif %}"></i>
        {% else %}
            <i class="fas fa-sort" style="opacity:.25"></i>
        {% endif %}
    </a>
</th>

<footer class="app-footer">
    <span><strong>{{ site.short_name|default:"SkillyCMS" }}</strong>
        &middot; {{ site.college_name|default:"Your College" }}{% if site.city %}, {{ site.city }}{% endif %}</span>
    {% if site.footer_note %}<span class="text-muted">{{ site.footer_note }}</span>{% endif %}
    <span class="ml-auto">{% now "Y" %}</span>
</footer>

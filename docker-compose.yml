services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enavajyothi}
      POSTGRES_USER: ${POSTGRES_USER:-enavajyothi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The web container waits for this, so it never runs migrations against
      # a database that is still starting up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enavajyothi} -d ${POSTGRES_DB:-enavajyothi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-enavajyothi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enavajyothi}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      BEHIND_TLS_PROXY: ${BEHIND_TLS_PROXY:-False}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-False}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    volumes:
      # Uploaded logos and photographs, plus the generated secret key.
      # Without this they are lost on every rebuild.
      - app_data:/data
    ports:
      - "${PORT:-8000}:8000"

volumes:
  db_data:
  app_data:
